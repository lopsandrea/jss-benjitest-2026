---
experiment:
  name: framework_test-full-evaluation
  dataset: classes2test
llms:
  - name: gpt-4o-mini
    provider: openai
    model: gpt-4o-mini
    temperature: 0
    seed: 42
  - name: gpt-4.1
    provider: openai
    model: gpt-4.1
    temperature: 0
    seed: 42
  - name: o3
    provider: openai
    model: o3
    temperature: 0
  - name: o4-mini
    provider: openai
    model: o4-mini
    temperature: 0
  - name: gemini-1.5-pro
    provider: google-ai
    model: gemini-1.5-pro
    temperature: 0
  - name: gemini-2.5-pro
    provider: google-ai
    model: gemini-2.5-pro
    temperature: 0
  - name: llama-3.1-70b
    provider: vllm
    model: meta-llama/Meta-Llama-3.1-70B-Instruct
    temperature: 0
    seed: 42
  - name: deepseek-r1
    provider: vllm
    model: deepseek-ai/DeepSeek-R1-Distill-Llama-70B
    temperature: 0
    seed: 42
  - name: grok-3
    provider: xai
    model: grok-3
    temperature: 0
    seed: 42
  
strategies:
  - name: zero-shot
    type: static
    prompt_file: prompts/zero_shot_java_test.txt
  - name: few-shot
    type: static
    prompt_file: prompts/few_shot_java_test.txt
  - name: dynamic
    type: dynamic
    agents:
      class_analyzer: true
      black_box_tester: true
      white_box_tester: true
      prompt_engineer: true
  - name: pseudo-code
    type: intermediate
    agents:
      class_analyzer: true
      intermediate_representation: true
correction:
  enabled: true
  max_attempts: 5
  agents:
    error_interpreter: true
    classifier: true
    intermediate_representation: true
build:
  timeout_seconds: 1800
  inject_dependencies_for_metrics: true
metrics:
  coverage:
    line: true
    branch: true
    method: true
  mutation:
    enabled: true
    threads: 4
  smells:
    enabled: true
reporting:
  save_candidate_test_files: true
  save_error_logs: true
  output_dir: data/raw
  formats:
    - csv
logging:
  level: INFO
  save_llm_responses: true
execution:
  # 64 classes per model in flight, across 8 worker nodes: 512 concurrent tasks,
  # which is the figure the paper's wall-clock estimate rests on.
  parallel_jobs: 64
  batch_size: 64
  allow_reuse_project_sandboxes: false
